[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-app-conflict-fixer"
version = "0.1.0"
description = "Diagnose iOS extension bundle ID conflicts and repair confirmed residual records on macOS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "iOS App Conflict Fixer contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: MacOS", "Programming Language :: Python :: 3"]

[project.scripts]
ios-conflict-fixer = "ios_app_conflict_fixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
